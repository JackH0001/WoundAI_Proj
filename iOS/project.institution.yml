include:
  - project.yml

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.0.0

# Dedicated private medical test product. OAuth/IAP and App RBAC are separate gates.
targets:
  WoundAIInstitution:
    type: application
    platform: iOS
    sources:
      # 只收新架構。**不要**加 Modules/ Views/ Services/ Analysis/ Utils/ Models/，
      # 理由見檔頭。
      - path: WoundMeasurementApp/Generated
      - path: WoundMeasurementApp/Core
      - path: WoundMeasurementApp/Pipeline
      - path: WoundMeasurementApp/UI
      - path: WoundMeasurementApp/Assets.xcassets
        type: folder.assetcatalog
        buildPhase: resources
      # 使用手冊：與 Android assets/manual.html 同一份檔（兩端共用，內容才不會分岔）。
      - path: WoundMeasurementApp/Resources/manual.html
        buildPhase: resources
      # 隱私宣告（2024-05 起 App Store 強制）。**必須進 resources**——
      # 放進 build 卻沒被打包，上傳時才會收到 ITMS-91053 而那時已經在等審查了。
      - path: WoundMeasurementApp/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: WoundMeasurementApp/Info.plist
        buildPhase: none
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woundai.app.mmhps20261007
        CURRENT_PROJECT_VERSION: 39
        INFOPLIST_FILE: WoundMeasurementApp/InstitutionInfo.plist
        # ⚠ 不可同時開 GENERATE_INFOPLIST_FILE 與 INFOPLIST_FILE：舊專案兩者都設，
        #   而 build setting 裡的 NSCameraUsageDescription 與 Info.plist 裡的字串不一致，
        #   實際上架時哪一份生效要看合併結果。這裡只留 Info.plist 一個來源。
        GENERATE_INFOPLIST_FILE: NO
        # opencv2.xcframework 不在 repo 裡，端上 ArUco 因此不可用（與 Android 相同：
        # ArucoDetector 是 stub，ArUco 一律在後端做）。要啟用端上 ArUco 時，把
        # framework 放進 WoundMeasurementApp/ 並在此加回連結設定與 OpenCV/ 來源目錄。
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WOUND_INSTITUTION"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WOUND_INSTITUTION DEBUG"

  WoundAIInstitutionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WoundAITests/MedicalSessionPoolTests.swift
      - path: WoundAITests/BackendLoginAndCaptureTests.swift
      - path: WoundAITests/InstitutionGoogleTokenTests.swift
      - path: WoundAITests/InstitutionIAPTransportTests.swift
      - path: WoundAITests/ClinicalReviewRecordTests.swift
      - path: WoundAITests/ClinicalUploadFlowTests.swift
      - path: WoundAITests/ClinicalUploadOutboxTests.swift
      - path: WoundAITests/InstitutionPrivateExportsTests.swift
      - path: WoundAITests/InstitutionExportTests.swift
      - path: WoundAITests/TissueEditCountTests.swift
      - path: WoundAITests/TissuePreviewTests.swift
      - path: WoundAITests/InstitutionRestoreTests.swift
      - path: WoundAITests/DepthProvenanceTests.swift
      - path: WoundAITests/MedicalRuntimeTests.swift
      - path: WoundAITests/MedicalDataScopeTests.swift
      - path: WoundAITests/MedicalAccountPreferencesTests.swift
      - path: WoundAITests/MedicalWoundProfileTests.swift
    dependencies:
      - target: WoundAIInstitution
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.woundai.app.mmhps20261007.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WoundAIInstitution.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WoundAIInstitution"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WOUND_INSTITUTION_TESTS"

  WoundAIInstitutionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WoundAIInstitutionUITests
    dependencies:
      - target: WoundAIInstitution
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.woundai.app.mmhps20261007.uitests
        TEST_TARGET_NAME: WoundAIInstitution

schemes:
  WoundAIInstitution:
    build:
      targets:
        WoundAIInstitution: all
        WoundAIInstitutionTests: [test]
        WoundAIInstitutionUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WoundAIInstitutionTests
        - WoundAIInstitutionUITests
    archive:
      config: Release
