  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-contract:
    name: audit-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Backend/Flask/requirements.lock

      - name: Install the exact backend runtime
        run: pip install --require-hashes -r Backend/Flask/requirements.lock

      - name: Audit-chain and P0-4 regression gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          WOUNDAI_REQUIRE_FUNCTIONAL_TESTS: '1'
        run: |
          command -v pwsh
          python -B engineering/phase2/test_audit_chain.py
          python -B engineering/phase2/test_audit_chain_versioning.py
          python -B engineering/phase2/test_audit_chain_concurrency.py
          python -B engineering/phase2/test_admin_console.py
          python -B engineering/phase2/test_deployment_scripts_static.py
          python -B engineering/phase2/test_deployment_input_gate.py
          python -B engineering/phase2/test_check_locked_epoch_gate.py
          python -B engineering/phase2/test_ci_gate_static.py
          python -B engineering/phase2/test_ci_gate_runtime.py
          python -B engineering/phase2/test_hardening_lifecycle.py
          python -B engineering/phase2/test_backend_http_safety.py
          python -B engineering/phase2/test_http_launcher_isolation.py
          python -B engineering/phase2/test_audit_console_verdict.py
          python -B engineering/phase2/test_test_isolation_from_cloud.py
          python -B engineering/phase2/test_backend_url_parity.py
          python -B engineering/phase2/test_secret_key_fail_closed.py
          python -B engineering/phase2/test_gitleaks_rule_precision.py
          python -B engineering/phase2/test_inventory_is_read_only.py
          python -B engineering/phase2/test_audit_retention_disclosure.py
          python -B engineering/phase2/test_demo_seed_guardrails.py
          python -B engineering/phase2/test_demo_deploy_isolation.py
          python -B engineering/phase2/test_demo_deploy_checks.py
          python -B engineering/phase2/test_store_abstraction.py
          python -B engineering/phase2/test_lite_segment.py
          python -B engineering/phase2/test_lite_quota.py
          python -B engineering/phase2/test_lite_revision.py
          python -B engineering/phase2/test_lite_storage_receipt.py
          python -B engineering/phase2/test_lite_withdrawal_admission.py
          python -B engineering/phase2/test_lite_withdrawal_budget.py
          python -B engineering/phase2/test_lite_withdrawal_readers.py
          python -B engineering/phase2/test_lite_http_lifecycle.py
          python -B engineering/phase2/test_lite_raw_depth_contract.py
          python -B engineering/phase2/test_lite_raw_depth_store.py
          python -B engineering/phase2/test_lite_raw_depth_http.py
          python -B engineering/phase2/test_packaged_preprocessing.py
          python -B engineering/phase2/test_lite_build_context.py
          python -B engineering/phase2/test_lite_build_plan.py
          python -B engineering/phase2/test_lite_candidate_deploy_plan.py
          python -B engineering/phase2/test_lite_attest_request.py
          python -B engineering/phase2/test_lite_attest_assertion.py
          python -B engineering/phase2/test_lite_attest_registration.py
          python -B engineering/phase2/test_lite_attest_state.py
          python -B engineering/phase2/test_lite_attest_receipt.py
          python -B engineering/phase2/test_lite_attest_enrollment.py
          python -B engineering/phase2/test_lite_attest_http.py
          python -B engineering/phase2/test_lite_privacy_state.py
          python -B engineering/phase2/test_lite_withdrawal_fence.py
          python -B engineering/phase2/test_lite_ledger_purge.py
          python -B engineering/phase2/test_lite_bucket_policy.py
          python -B engineering/phase2/test_lite_service_profile.py
          python -B engineering/phase2/test_lite_face_privacy.py
          python -B engineering/phase2/test_lite_fenced_objects.py
          python -B engineering/phase2/test_lite_fenced_manifest.py
          python -B engineering/phase2/test_lite_fenced_http.py
          python -B tools/test_lite_rgbd_preflight.py
          python -B tools/test_provision_mmh_foundation.py
          python -B tools/test_restrict_mmh_bucket_iam.py
          python -B tools/test_mmh_institution.py
          python -B tools/test_mmh_app_boundary.py
          python -B tools/test_protect_mmh_buckets.py
          python -B tools/test_verify_mmh_effective_iam.py
          python -B tools/test_medical_build_smoke.py
          python -B tools/test_medical_image_build.py
          python -B tools/test_plan_mmh_runtime.py
          python -B tools/test_check_mmh_runtime_preflight.py
          python -B tools/test_migrate_mmh_editor.py
          python -B engineering/phase2/test_p0_4_staging.py
          python -B engineering/phase2/test_runtime_golden_contract.py

      - name: Runtime canonicalization golden
        run: python -B Backend/Flask/runtime_golden.py --verify

      - name: Synthetic HTTP consent lifecycle in isolated LocalStore
        run: python -B tools/windows/run_backend_http_test.py --out "$RUNNER_TEMP/woundai-http" --timeout 300

  backend-image:
    name: backend-image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false

      - name: Build the Cloud Run backend image
        run: docker build --tag woundai-backend:p0-4-audit Backend/Flask

      - name: Prove the image contains the shared audit contract
        run: >-
          docker run --rm --entrypoint python woundai-backend:p0-4-audit -B -c
          "import audit_chain_contract, store, api_flywheel;
          print('backend audit imports OK')"
