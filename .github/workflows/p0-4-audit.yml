name: p0-4-audit

on:
  push:
    branches: [main]
    paths:
      - 'Backend/Flask/**'
      - 'engineering/phase2/test_audit_chain.py'
      - 'engineering/phase2/test_audit_chain_concurrency.py'
      - 'engineering/phase2/test_audit_chain_versioning.py'
      - 'engineering/phase2/test_admin_console.py'
      - 'engineering/phase2/test_deployment_scripts_static.py'
      - 'engineering/phase2/test_p0_4_staging.py'
      - 'engineering/phase2/test_runtime_golden_contract.py'
      - 'engineering/phase2/test_store_abstraction.py'
      - 'engineering/phase2/verify_audit_chain.py'
      - '.github/workflows/p0-4-audit.yml'
  pull_request:
    paths:
      - 'Backend/Flask/**'
      - 'engineering/phase2/test_audit_chain.py'
      - 'engineering/phase2/test_audit_chain_concurrency.py'
      - 'engineering/phase2/test_audit_chain_versioning.py'
      - 'engineering/phase2/test_admin_console.py'
      - 'engineering/phase2/test_deployment_scripts_static.py'
      - 'engineering/phase2/test_p0_4_staging.py'
      - 'engineering/phase2/test_runtime_golden_contract.py'
      - 'engineering/phase2/test_store_abstraction.py'
      - 'engineering/phase2/verify_audit_chain.py'
      - '.github/workflows/p0-4-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-contract:
    name: audit-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Backend/Flask/requirements.lock

      - name: Install the exact backend runtime
        run: pip install --require-hashes -r Backend/Flask/requirements.lock

      - name: Audit-chain and P0-4 regression gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B engineering/phase2/test_audit_chain.py
          python -B engineering/phase2/test_audit_chain_versioning.py
          python -B engineering/phase2/test_audit_chain_concurrency.py
          python -B engineering/phase2/test_admin_console.py
          python -B engineering/phase2/test_deployment_scripts_static.py
          python -B engineering/phase2/test_store_abstraction.py
          python -B engineering/phase2/test_p0_4_staging.py
          python -B engineering/phase2/test_runtime_golden_contract.py

      - name: Runtime canonicalization golden
        run: python -B Backend/Flask/runtime_golden.py --verify

  backend-image:
    name: backend-image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false

      - name: Build the Cloud Run backend image
        run: docker build --tag woundai-backend:p0-4-audit Backend/Flask

      - name: Prove the image contains the shared audit contract
        run: >-
          docker run --rm --entrypoint python woundai-backend:p0-4-audit -B -c
          "import audit_chain_contract, store, api_flywheel;
          print('backend audit imports OK')"
