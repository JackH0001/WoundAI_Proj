# .github/workflows/android.yml
#
# Builds and unit-tests the Android client using Gradle.
# Instrumentation tests (androidTest) require an emulator so they are
# wired behind a separate job that only runs on the main branch.
name: android-client

on:
  push:
    branches: [main, develop]
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  unit-test:
    name: assemble + unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.13"   # 釘住與 AGP 8.12 相容版(runner 預設 9.6.x 移除 AGP 依賴之內部 API)

      - name: Gradle assembleDebug
        run: gradle assembleDebug --no-daemon

      - name: Gradle test
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: Android/app/build/reports/tests/**
          if-no-files-found: warn

  instrumentation-test:
    name: androidTest (emulator)
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api29

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_5
          working-directory: Android
          # ⚠ 用 `./gradlew`，不要用裸的 `gradle`。
          #
          # 上面 assemble 那個 job 有一步 `gradle/actions/setup-gradle@v3` 把版本釘在 8.13，
          # 註解寫明理由：runner 預設的 Gradle 9.6.x 移除了 AGP 依賴的內部 API。
          # 但**那一步只作用於它自己的 job**——這個 job 沒有，於是 `gradle` 解析到
          # runner 的預設版本，撞上同一個不相容。
          #
          # 兩個 job 用同一個指令、結果不同，看起來會像模擬器的問題，
          # 而實際差別在 PATH 上的 Gradle 是哪一版。
          # wrapper（`gradle-wrapper.properties` 釘 8.13）本來就在版控裡，用它最省事。
          #
          # `chmod +x` 是保險，不是多餘的：git 只記 100644/100755 這一個位元，
          # 而 Windows 的檔案系統沒有執行位——從 Windows 提交 `gradlew` 就會把它記成
          # 100644，Linux runner 上 `./gradlew` 直接 "Permission denied"。
          # 2026-08-10 實際發生過（本次修的第二層）。已用 `git update-index --chmod=+x`
          # 修正模式位，這一行保證未來再被 Windows 覆寫掉時 CI 仍然跑得起來。
          script: chmod +x ./gradlew && ./gradlew connectedDebugAndroidTest --no-daemon
