# .github/workflows/endpoint-guards.yml  (v2)
#
# 端點守門迴歸測試 —— PR #3 的非實作者覆核要求進 CI。
#
# 為什麼 WOUNDAI_REQUIRE_FUNCTIONAL_TESTS=1 不可省：
# 這個測試檔有兩個「功能面」測試（無 patient.manage 的角色打 restore 必須 403、
# 有效 JWT 打 /api/train 必須 410 且三個訓練寫入函式一次都不得被呼叫）。
# 沒有這個環境變數時，Flask 匯入失敗只會 skip —— 結構測試全綠、功能面根本沒跑，
# 而「看起來已驗證、實際沒有」正是 2026-08 這一整輪覆核在防的失敗型態。
# 設了它，skip 變成 fail：要嘛真的跑、要嘛紅燈，沒有安靜的中間態。
#
# 宣稱邊界（覆核要求寫清楚，不得超講）：
#   釘住的：本檔案位元組（sha256 由 14 號腳本比對）、setup-python 的完整 commit
#   SHA（2026-08-23 自 GitHub API 取得並核對 = v5.6.0）。
#   沒釘的：actions/checkout 仍用 v4 tag——本輪無法從可驗證來源取得其 SHA
#   （API 匿名 403），寧可留 tag 也不抄一個查證不了的值；後續請用已認證的
#   `gh api repos/actions/checkout/tags` 取值再釘。requirements 用 >= 範圍。
#   因此本 workflow 只宣稱「檔案即覆核那份」，不宣稱「執行環境完全可重現」。
#
# 觸發範圍刻意涵蓋整個 Backend/Flask/** —— 守門矩陣（auth_users.PERMS）、
# api_flywheel、app.py 任何一個動了都要重驗；再加測試檔與本 workflow 自身。
name: endpoint-guards

on:
  push:
    branches: [main]
    paths:
      - 'Backend/Flask/**'
      - 'engineering/phase2/test_endpoint_guards.py'
      - '.github/workflows/endpoint-guards.yml'
  pull_request:
    paths:
      - 'Backend/Flask/**'
      - 'engineering/phase2/test_endpoint_guards.py'
      - '.github/workflows/endpoint-guards.yml'
  workflow_dispatch:

# 最小權限：只讀 repo 內容。本 workflow 不需要寫任何東西。
permissions:
  contents: read

jobs:
  endpoint-guards:
    name: endpoint-guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4    # 未釘 SHA，理由見檔頭「宣稱邊界」
        with:
          lfs: true
          persist-credentials: false   # 後續步驟拿不到 token——它們也不該拿到

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Backend/Flask/requirements.txt'

      # 與正式後端同一份 requirements —— 測的必須是會被部署的那個 app.py。
      # pytest 不在 requirements 裡（那是部署清單），這裡另裝。
      - name: Install backend requirements + pytest
        run: pip install -r Backend/Flask/requirements.txt pytest

      - name: Endpoint guard tests (functional tests NON-skippable)
        env:
          WOUNDAI_REQUIRE_FUNCTIONAL_TESTS: '1'
        run: python -m pytest engineering/phase2/test_endpoint_guards.py -v
