# .github/workflows/ios.yml
#
# Builds both iOS apps and tests the WoundMeasurementApp project on every push / PR
# that touches the iOS directory.
#
# Runner: macos-15 (Apple Silicon, newest installed Xcode)
# Scheme: WoundMeasurementApp
# Targets: build (Release) + XCTest unit tests (iPhone simulator)
#
# Code signing
# ------------
# CI uses xcodebuild CODE_SIGNING_ALLOWED=NO
# to skip signing during unit-test builds. Distribution signing (for
# TestFlight / App Store) requires separate secrets and a provisioning
# profile — see the commented-out "archive" step at the bottom.
name: ios-client

on:
  push:
    branches: [main, develop]
    paths:
      - 'iOS/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'iOS/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: xcodebuild (newest on runner)
    runs-on: macos-15
    timeout-minutes: 40

    defaults:
      run:
        working-directory: iOS
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # ⚠ 不再釘死 Xcode 版本（原本是 15.4）。brew 裝的 XcodeGen 是最新版，
      #   產出的專案格式（objectVersion 77）舊 Xcode 讀不懂——
      #   「future Xcode project file format」那個 25 秒必倒就是這把剪刀差。
      #   選 runner 上最新的 Xcode，image 更新時兩邊一起前進，不會再被剪到。
      - name: Select newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      # ⚠ 這一步不可省：xcodeproj 自 70572ce 起是 XcodeGen 產物、不進版控
      #   （單一事實來源是 project.yml，理由見該檔檔頭）。少了這步，
      #   下面每一個 -project 引用都會以「找不到專案」秒失敗。
      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Show SDK / Simulator list
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json | \
              python3 -c "import sys,json; devs=json.load(sys.stdin)['devices']; \
              [print(k, v[0]['name']) for k,v in devs.items() if v and 'iPhone' in v[0]['name']]" \
              2>/dev/null | head -10 || true

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
              -project WoundMeasurementApp.xcodeproj \
              -scheme WoundMeasurementApp \
              CODE_SIGNING_ALLOWED=NO

      - name: Build both apps (Release, no signing)
        run: |
          set -euo pipefail
          for SCHEME in WoundMeasurementApp WoundLite; do
            xcodebuild build \
              -project WoundMeasurementApp.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              2>&1 | tee "build-${SCHEME}.log"
          done

      - name: Select an installed iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > /tmp/woundai-simulators.json
          python3 - <<'PY'
          import json, os, re
          with open('/tmp/woundai-simulators.json') as source:
              devices = json.load(source)['devices']
          candidates = [
              (tuple(map(int, re.findall(r'\d+', runtime))), device['udid'])
              for runtime, rows in devices.items() if '.iOS-' in runtime
              for device in rows if device['name'].startswith('iPhone')
          ]
          if not candidates:
              raise SystemExit('No available iPhone simulator is installed')
          selected = max(candidates)[1]
          print('Selected iPhone simulator: ' + selected)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('udid=' + selected + '\n')
          PY

      - name: Run XCTest unit tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild test \
              -project WoundMeasurementApp.xcodeproj \
              -scheme WoundMeasurementApp \
              -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
              CODE_SIGNING_ALLOWED=NO \
              -resultBundlePath TestResults.xcresult \
              2>&1 | tee test-results.log

      - name: Verify tests actually ran
        run: |
          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult > test-summary.json
          python3 - <<'PYTEST'
          import json
          with open('test-summary.json') as source:
              summary = json.load(source)
          print(json.dumps(summary, indent=2))
          if summary.get('passedTests', 0) <= 0 or summary.get('failedTests', -1) != 0:
              raise SystemExit('Expected at least one passing test and zero failures')
          PYTEST

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            iOS/TestResults.xcresult
            iOS/test-results.log
            iOS/test-summary.json
            iOS/build-*.log
          if-no-files-found: warn

      # ── Distribution build (uncomment when code signing is configured) ──
      # - name: Archive for distribution
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     xcodebuild archive \
      #         -project WoundMeasurementApp.xcodeproj \
      #         -scheme WoundMeasurementApp \
      #         -archivePath build/WoundAI.xcarchive \
      #         CODE_SIGN_IDENTITY="Apple Distribution: ..." \
      #         PROVISIONING_PROFILE_SPECIFIER="..."
