# .github/workflows/ios.yml
#
# Builds and tests the WoundMeasurementApp iOS project on every push / PR
# that touches the iOS directory.
#
# Runner: macos-14 (Apple Silicon, Xcode 15+)
# Scheme: WoundMeasurementApp
# Targets: build (Release) + XCTest unit tests (iPhone simulator)
#
# Code signing
# ------------
# CI uses xcodebuild CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
# to skip signing during unit-test builds. Distribution signing (for
# TestFlight / App Store) requires separate secrets and a provisioning
# profile — see the commented-out "archive" step at the bottom.
name: ios-client

on:
  push:
    branches: [main, develop]
    paths:
      - 'iOS/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'iOS/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: xcodebuild (${{ matrix.xcode }})
    runs-on: macos-14
    timeout-minutes: 40
    env:
      # ── OpenCV 是「可選相依」 ────────────────────────────────────────────
      # Obj-C++ 橋接層 (.mm) 用 __has_include 判斷有沒有 OpenCV 標頭：
      #   有 → 走真正的 OpenCV 實作
      #   無 → 整檔降級為安全 stub，Swift 端改走 Core Image Hough 備援
      # 因此「沒有二進位」不再等於「不能編譯」，CI 仍可完整驗證 Swift 層。
      #
      # 只用 CORE 模組（imgproc / features2d）；ArUco/contrib 不需要
      # （貼紙校正是 Apple Vision 實作的）。
      #
      # 要讓 CI 真的連結 OpenCV：
      #   1. Actions → "Build OpenCV xcframework (one-time)" → Run workflow
      #   2. 從該次 run 的 Summary 抄出 SHA-256
      #   3. 填進下面的 OPENCV_XCFRAMEWORK_SHA256（取代 REPLACE_WITH_REAL_SHA256）
      # URL 與 SHA-256 一起以 PR 方式更動，供應鏈可稽核（IEC 62304 SOUP）。
      OPENCV_VERSION: "4.8.0"
      OPENCV_XCFRAMEWORK_URL: "https://github.com/JackH0001/WoundAI_Proj/releases/download/opencv-4.8.0-ios/opencv2.xcframework.zip"
      OPENCV_XCFRAMEWORK_SHA256: "REPLACE_WITH_REAL_SHA256"

    strategy:
      fail-fast: false
      matrix:
        xcode: ['15.4']

    defaults:
      run:
        working-directory: iOS

    steps:
      - uses: actions/checkout@v4

      - name: Cache OpenCV xcframework
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: iOS/WoundMeasurementApp/opencv2.xcframework
          key: opencv-xcframework-${{ env.OPENCV_VERSION }}-${{ env.OPENCV_XCFRAMEWORK_SHA256 }}

      - name: Fetch & verify OpenCV xcframework (optional)
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ "$OPENCV_XCFRAMEWORK_SHA256" = "REPLACE_WITH_REAL_SHA256" ]; then
            echo "::notice::OPENCV_XCFRAMEWORK_SHA256 尚未填入 —— 以 stub 模式建置。"
            echo "::notice::圓形偵測會走 Core Image Hough 備援；Swift 層建置與單元測試不受影響。"
            echo "::notice::要啟用真正的 OpenCV，先跑 'Build OpenCV xcframework (one-time)' workflow 取得 SHA-256。"
            exit 0
          fi
          dest="WoundMeasurementApp/opencv2.xcframework"   # cwd is iOS/
          echo "Downloading $OPENCV_XCFRAMEWORK_URL"
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/opencv2.zip" "$OPENCV_XCFRAMEWORK_URL"
          echo "Verifying SHA-256"
          echo "$OPENCV_XCFRAMEWORK_SHA256  $RUNNER_TEMP/opencv2.zip" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/ocv" && mkdir -p "$RUNNER_TEMP/ocv"
          unzip -q "$RUNNER_TEMP/opencv2.zip" -d "$RUNNER_TEMP/ocv"
          src="$(find "$RUNNER_TEMP/ocv" -maxdepth 4 -type d -name opencv2.xcframework | head -1)"
          test -n "$src" || { echo "::error::opencv2.xcframework not found inside the downloaded archive"; exit 1; }
          rm -rf "$dest"; cp -R "$src" "$dest"

      - name: Configure OpenCV linkage (validates slices if present)
        id: opencv
        run: |
          set -euo pipefail
          # 有 xcframework 就產生 Config/OpenCV.local.xcconfig 並驗證 slice；
          # 沒有就移除該檔，專案自動回到 stub 模式。
          ./Scripts/link-opencv.sh
          if ./Scripts/link-opencv.sh --check >/dev/null 2>&1; then
            echo "mode=linked" >> "$GITHUB_OUTPUT"
          else
            echo "mode=stub" >> "$GITHUB_OUTPUT"
          fi

      - name: Record OpenCV mode in run summary
        run: |
          {
            echo "### OpenCV 連結狀態"
            echo ""
            if [ "${{ steps.opencv.outputs.mode }}" = "linked" ]; then
              echo "已連結 opencv2.xcframework（版本 \`$OPENCV_VERSION\`，SHA-256 \`$OPENCV_XCFRAMEWORK_SHA256\`）。"
            else
              echo "**Stub 模式** —— 未連結 OpenCV。"
              echo ""
              echo "Swift 層的建置與單元測試全部照跑；圓形偵測走 Core Image Hough 備援演算法。"
              echo "要啟用真正的 OpenCV，跑一次 \`Build OpenCV xcframework (one-time)\` workflow，"
              echo "把 Summary 上的 SHA-256 填進 \`.github/workflows/ios.yml\` 的 \`OPENCV_XCFRAMEWORK_SHA256\`。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Show SDK / Simulator list
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json | \
              python3 -c "import sys,json; devs=json.load(sys.stdin)['devices']; \
              [print(k, v[0]['name']) for k,v in devs.items() if v and 'iPhone' in v[0]['name']]" \
              2>/dev/null | head -10 || true

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
              -project WoundMeasurementApp.xcodeproj \
              -scheme WoundMeasurementApp \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO

      - name: Build (Release, no signing)
        run: |
          xcodebuild build \
              -project WoundMeasurementApp.xcodeproj \
              -scheme WoundMeasurementApp \
              -configuration Release \
              -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              ONLY_ACTIVE_ARCH=NO \
              | xcpretty --color || xcodebuild build \
                  -project WoundMeasurementApp.xcodeproj \
                  -scheme WoundMeasurementApp \
                  -configuration Release \
                  -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
                  CODE_SIGN_IDENTITY="" \
                  CODE_SIGNING_REQUIRED=NO \
                  ONLY_ACTIVE_ARCH=NO

      - name: Run XCTest unit tests
        run: |
          xcodebuild test \
              -project WoundMeasurementApp.xcodeproj \
              -scheme WoundMeasurementApp \
              -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              -resultBundlePath TestResults.xcresult \
              | xcpretty --color --report junit \
                  --output test-results.xml \
              || xcodebuild test \
                  -project WoundMeasurementApp.xcodeproj \
                  -scheme WoundMeasurementApp \
                  -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
                  CODE_SIGN_IDENTITY="" \
                  CODE_SIGNING_REQUIRED=NO \
                  -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-xcode${{ matrix.xcode }}
          path: |
            iOS/TestResults.xcresult
            iOS/test-results.xml
          if-no-files-found: warn

      # ── Distribution build (uncomment when code signing is configured) ──
      # - name: Archive for distribution
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     xcodebuild archive \
      #         -project WoundMeasurementApp.xcodeproj \
      #         -scheme WoundMeasurementApp \
      #         -archivePath build/WoundAI.xcarchive \
      #         CODE_SIGN_IDENTITY="Apple Distribution: ..." \
      #         PROVISIONING_PROFILE_SPECIFIER="..."
