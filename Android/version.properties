# APK version - single source of truth. Read by build.gradle, bumped by build_release.ps1.
#
# ASCII ONLY. Do not put Chinese comments in this file.
#
#   1) Java's Properties.load() reads ISO-8859-1, so non-ASCII needs \uXXXX escapes.
#   2) Windows PowerShell 5.1's Get-Content defaults to the system ANSI code page
#      (Big5/cp950 on zh-TW). Round-tripping a UTF-8 file with CJK text through
#      Get-Content -> WriteAllLines corrupts it, and a cp950 lead byte can swallow
#      the following 0x0A, merging two lines into one.
#
# That is exactly how this file was destroyed on 2026-08-05: "versionCode=2" ended up
# glued to the tail of a comment line, Properties.load skipped it, build.gradle fell
# back to 1 -- and the build reported SUCCESS. Keeping this file ASCII removes the
# whole class of problem. Rationale in Chinese: docs/apk_install_troubleshooting.md
#
# versionCode must increase monotonically. Android uses it to decide whether an APK is
# an update; a stale value gives INSTALL_FAILED_VERSION_DOWNGRADE, which the phone UI
# reports only as "App not installed".
versionCode=18
versionName=1.0
